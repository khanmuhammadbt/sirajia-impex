{% extends "base.html" %}

{% block title %}Manage Companies{% endblock title %}
{% block link %}<link rel="stylesheet" href="{{ url_for('static', filename='css/add_company.css') }}">{% endblock link %}
{% block main %}
<div class="form-container">
    <section class="form-section">
        <h2>Add New Company</h2>
        <form action="{{ url_for('main.add_comp_method') }}" method="post" class="styled-form">
            <div class="form-group">
                <label for="company_name">Company Name</label>
                <input type="text" id="company_name" name="company_name" placeholder="e.g. Acme Corp" required>
            </div>
            
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Full business address" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="ntn">NTN</label>
                    <input type="text" id="ntn" name="ntn" placeholder="NTN Number" required>
                </div>
                <div class="form-group">
                    <label for="gst">GST</label>
                    <input type="text" id="gst" name="gst" placeholder="GST Number" required>
                </div>
            </div>

            <div class="form-group">
                <label for="payment_days">Payment Terms (Days)</label>
                <input type="number" id="payment_days" name="payment_days" placeholder="payment_days" min="0"  required>
            </div>

            <button type="submit" class="btn-submit">Add Company</button>
        </form>
    </section>

    <hr class="separator">

    <section class="form-section delete-section">
        <h2>Delete Company</h2>
        <p class="warning-text">Warning: This action cannot be undone.</p>
        <form action="{{ url_for('main.delete_company_method') }}" method="post" class="styled-form inline-form" onsubmit="return confirm('Are you sure you want to delete this company?');">
            <div class="form-group">
                <label for="del_company_name">Company Name to Remove</label>
                <input type="text" id="del_company_name" name="company_name" required>
            </div>
            <button type="submit" class="btn-delete">Delete Company</button>
        </form>
    </section>
</div>
<script>
    document.addEventListener('keydown', function(e) {
    // Check if the pressed key is Up (38) or Down (40)
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        
        // Get all focusable inputs within the current form
        const activeElement = document.activeElement;
        if (activeElement.tagName === 'INPUT') {
            const form = activeElement.form;
            const inputs = Array.from(form.querySelectorAll('input, button'));
            const index = inputs.indexOf(activeElement);

            if (e.key === 'ArrowDown' && index < inputs.length - 1) {
                // Prevent page scrolling and move to next input
                e.preventDefault();
                inputs[index + 1].focus();
            } else if (e.key === 'ArrowUp' && index > 0) {
                // Prevent page scrolling and move to previous input
                e.preventDefault();
                inputs[index - 1].focus();
            }
        }
    }
});
</script>
{% endblock main %}
